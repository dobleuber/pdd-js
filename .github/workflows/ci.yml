name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # pnpm skips linking a workspace bin whose target does not exist yet, so
      # node_modules/.bin/pdd only appears after dist/cli.js has been built.
      - run: pnpm install --frozen-lockfile --offline
      - run: pnpm --filter pdd test
      - run: pnpm --filter pdd-redteam test
      - run: pnpm --filter example-shopping-cart exec pdd check --ci
      # Law strength: fails (exit 6) if the mutation score drops below the locked threshold.
      - run: pnpm --filter example-shopping-cart exec pdd mutate --ci
